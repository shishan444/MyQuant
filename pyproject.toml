[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MyQuant"
version = "0.16.0"
description = "BTC/ETH 量化交易策略进化工具"
authors = [{name = "MyQuant Team"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-binance>=1.0.19",
    "vectorbt==0.28.5",
    "pandas-ta>=0.3.14b",
    "deap>=1.4.1",
    "plotly>=5.22.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=16.0.0",
    "pyyaml>=6.0",
    "anthropic>=0.30.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
    "python-multipart>=0.0.6",
    "keyring>=25.0",
    "scikit-learn>=1.3.0",
    "SQLAlchemy>=2.0",
    "python-socketio>=5.11",
    "mcp==2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[project.scripts]
myquant = "MyQuant.main:main"

[tool.coverage.report]
show_missing = true
# Global fail_under is set in pytest via --cov-fail-under after the batch-1
# branch-coverage baseline is measured (adding --cov-branch lowers the combined
# percent, so the floor must be re-calibrated, not copied from the old 78%).
