[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --cov=core --cov=api --cov-report=term-missing --cov-branch --cov-fail-under=74
# JSON 覆盖率档案（--cov-report=json:coverage.json）为全量基线专用产物，
# 不放全局 addopts——任何局部跑（含 --collect-only）都会覆盖全量档案。
# 全量命令见 tests/README.md 执行说明。
markers =
    smoke: core pipeline smoke test (< 10s)
    unit: unit tests for individual functions/classes
    integration: integration/chain tests across modules
    slow: slow tests (> 5s)
    e2e: Playwright end-to-end tests
